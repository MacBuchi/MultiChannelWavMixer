name: Bump Version

on:
  push:
    branches:
      - Main

# Serialise runs so that rapid pushes to Main don't race each other.
# A queued run sees the commits that the previous run already bumped,
# so it will correctly find "nothing to do" and exit cleanly.
concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  bump:
    name: Bump Version
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push version-bump commit + tag
      actions: write    # dispatch release.yml via workflow_dispatch

    steps:
      - name: Checkout code (full history for commitizen)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Uses github.token by default — no PAT required

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies (incl. dev)
        run: uv sync --all-groups

      - name: Configure git bot identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Decision tree:
      #   1. New releasable commits exist → bump + push tag → dispatch release
      #   2. No new commits + no GitHub Release for latest tag → dispatch release (retrigger)
      #   3. No new commits + release already published → nothing to do
      - name: Bump version or retrigger release
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Ask commitizen if there is anything to bump (dry-run, no side effects).
          # NOTE: capture the exit code in the else-branch, NOT after fi.
          # POSIX: an if-compound with no matched condition and no else has exit
          # status 0, which would make $? after fi always 0.
          if uv run cz bump --dry-run --yes > /dev/null 2>&1; then
            echo "Releasable commits found — bumping."
            uv run cz bump --yes
            git push --follow-tags
            NEW_TAG=$(git describe --tags --abbrev=0)
            echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          else
            CZ_EXIT=$?
          fi

          # 21 = NoneIncrementExit  (commits found but none trigger a bump)
          # 16 = NoRevisionError    (no tag exists yet to base a bump from)
          # Both are "nothing to bump" — exit cleanly.
          if [ "$CZ_EXIT" -ne 21 ] && [ "$CZ_EXIT" -ne 16 ]; then
            echo "Commitizen exited with unexpected code $CZ_EXIT — check the cz bump logs above for details." >&2
            exit "$CZ_EXIT"
          fi

          # No new releasable commits. Check whether the latest tag has a published release.
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          if [ "$LATEST_TAG" = "none" ]; then
            echo "ℹ️  No tags and no releasable commits — nothing to do."
            exit 0
          fi

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$LATEST_TAG")

          if [ "$HTTP_STATUS" = "404" ]; then
            echo "⚠️  $LATEST_TAG has no GitHub Release — retriggering release workflow."
            echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "ℹ️  $LATEST_TAG is already released — nothing to do."
          fi

      # Dispatch release.yml via workflow_dispatch so that GITHUB_TOKEN is sufficient
      # (tag-push events created by GITHUB_TOKEN do not trigger downstream workflows,
      # but workflow_dispatch API calls always do).
      - name: Trigger Release workflow
        if: steps.bump.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml \
            --repo "${{ github.repository }}" \
            --ref Main \
            --field "tag=${{ steps.bump.outputs.tag }}"
