name: CI / Release

on:
  pull_request:
    branches:
      - Main

jobs:
  # ── 1. Run test suite ──────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: macos-latest
    permissions:
      checks: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies (incl. dev)
        run: uv sync --all-groups

      - name: Run pytest
        run: uv run pytest --tb=short -v --junitxml=test-results.xml -W default

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Pytest Results
          path: test-results.xml
          reporter: java-junit
          fail-on-error: false

  # ── 2. Build macOS app (only when tests pass) ──────────────────────────────
  build:
    name: Build macOS App
    needs: test
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies (incl. dev)
        run: uv sync --all-groups

      - name: Build app with PyInstaller
        run: bash build.sh

      - name: Zip app bundle
        run: |
          cd dist
          zip -r MultiChannelWavMixer.zip MultiChannelWavMixer.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiChannelWavMixer-macOS
          path: dist/MultiChannelWavMixer.zip
          retention-days: 30
