name: CI

on:
  pull_request:
    branches:
      - Main

jobs:
  # ── 1. Lint ──────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies (incl. dev)
        run: uv sync --all-groups

      - name: Ruff — lint
        run: uv run ruff check .

      - name: Ruff — format check
        run: uv run ruff format --check .

  # ── 2. Run test suite ──────────────────────────────────────────────────────
  test:
    name: Run Tests
    needs: lint
    runs-on: macos-latest
    permissions:
      checks: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies (incl. dev)
        run: uv sync --all-groups

      - name: Run pytest
        run: uv run pytest --tb=short -v --junitxml=test-results.xml -W default

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Pytest Results
          path: test-results.xml
          reporter: java-junit
          fail-on-error: false

  # ── 2. Build per platform (only when tests pass) ──────────────────────────
  build:
    name: Build — ${{ matrix.os-label }}
    needs: test
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner:   macos-14
            os-label: macOS ARM (Apple Silicon)
            artifact: MultiChannelWavMixer-macOS-arm64.zip

          - runner:   macos-15-intel
            os-label: macOS x64 (Intel)
            artifact: MultiChannelWavMixer-macOS-x64.zip

          - runner:   windows-latest
            os-label: Windows x64
            artifact: MultiChannelWavMixer-Windows-x64.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies (incl. dev)
        run: uv sync --all-groups

      - name: Build with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: uv run pyinstaller MultiChannelWavMixer.spec --noconfirm --log-level WARN

      - name: Ad-hoc code sign + zip (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --deep --force --sign - dist/MultiChannelWavMixer.app
          cd dist && zip -r ${{ matrix.artifact }} MultiChannelWavMixer.app

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv run pyinstaller MultiChannelWavMixer.spec --noconfirm --log-level WARN
          Compress-Archive -Path dist\MultiChannelWavMixer -DestinationPath dist\${{ matrix.artifact }}

      - name: Smoke test — macOS
        if: runner.os == 'macOS'
        run: |
          dist/MultiChannelWavMixer.app/Contents/MacOS/MultiChannelWavMixer &
          APP_PID=$!
          sleep 10
          if kill -0 "$APP_PID" 2>/dev/null; then
            kill "$APP_PID"
            echo "Smoke test passed: app still running after 10s"
          else
            wait "$APP_PID"
            EXIT=$?
            [ $EXIT -eq 0 ] || (echo "App crashed with exit $EXIT"; exit 1)
          fi

      - name: Smoke test — Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath 'dist\MultiChannelWavMixer\MultiChannelWavMixer.exe' -PassThru
          Start-Sleep 10
          if (!$proc.HasExited) { $proc.Kill(); exit 0 }
          if ($proc.ExitCode -ne 0) { Write-Error "App crashed with exit $($proc.ExitCode)"; exit 1 }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          retention-days: 30
