[project]
name = "multichannel-wav-mixer"
version = "1.0.0"
description = "Multichannel WAV file mixer with stereo mixdown"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "audioop-lts>=0.2.1; python_version >= '3.13'",
    "customtkinter>=5.2.2",
    "sounddevice>=0.5.0",
    "librosa>=0.10.0",
    "matplotlib>=3.10.0",
    "numpy>=1.26.4",
    "pyloudnorm>=0.1.0",
    "pydub>=0.25.1",
    "soundfile>=0.13.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "commitizen>=3.0",
    "pyinstaller>=6.19.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.0.0"
version_files = ["pyproject.toml:version"]
tag_format = "v$version"
update_changelog_on_bump = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # pydub 0.25.1 uses unescaped regex backslashes — not our code
    "ignore::SyntaxWarning:pydub",
    # audioop is deprecated in 3.12; audioop-lts covers 3.13+
    "ignore::DeprecationWarning:pydub",
]
